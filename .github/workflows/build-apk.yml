name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/TournamentApp.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TournamentApp-APK
          path: release_apk/TournamentApp.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download Link
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Tournament App Latest Release"
          body: |
            ## 📱 Download Tournament App APK
            Direct download link for Android:
            - **[TournamentApp.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/TournamentApp.apk)**
          files: release_apk/TournamentApp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
